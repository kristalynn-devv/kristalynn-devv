  <line class="rule" x1="32" y1="98" x2="848" y2="98" stroke-width="1"/>

  <text class="meta"   x="32"  y="117" font-size="12.5">Vue · Nuxt · Node · PHP · PostgreSQL — and TypeScript on what I start now</text>
