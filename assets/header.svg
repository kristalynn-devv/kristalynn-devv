<svg xmlns="http://www.w3.org/2000/svg" width="880" height="190" viewBox="0 0 880 190" role="img" aria-label="Kristalyn Narongpiyawathana — Full-Stack Developer">
  <style>
    :root { color-scheme: light dark; }
    .bg     { fill: #ffffff; stroke: #d8dee4; }
    .name   { fill: #1f2328; }
    .role   { fill: #59636e; }
    .meta   { fill: #6e7781; }
    .rule   { stroke: #d8dee4; }
    .accent { fill: #d9a441; }
    .accrule{ stroke: #d9a441; }
    @media (prefers-color-scheme: dark) {
      .bg     { fill: #0d1117; stroke: #30363d; }
      .name   { fill: #e6edf3; }
      .role   { fill: #9198a1; }
      .meta   { fill: #7d8590; }
      .rule   { stroke: #30363d; }
    }
    text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>

  <rect class="bg" x="0.5" y="0.5" width="879" height="189" rx="12" stroke-width="1"/>
  <rect class="accent" x="0" y="12" width="4" height="60" rx="2"/>

  <text class="name" x="32" y="56" font-size="34" font-weight="700" letter-spacing="-0.6">Kristalyn Narongpiyawathana</text>
  <text class="role" x="33" y="84" font-size="16" font-weight="500">Full-Stack Developer · transaction systems at branch scale</text>

  <line class="rule" x1="32" y1="110" x2="848" y2="110" stroke-width="1"/>

  <g font-size="13">
    <text class="accent" x="32"  y="140" font-size="20" font-weight="700">100</text>
    <text class="meta"  x="32"  y="160">branches</text>

    <text class="accent" x="150" y="140" font-size="20" font-weight="700">33</text>
    <text class="meta"  x="150" y="160">provinces</text>

    <text class="accent" x="272" y="140" font-size="20" font-weight="700">~180k</text>
    <text class="meta"  x="272" y="160">transactions / month</text>

    <text class="accent" x="470" y="140" font-size="20" font-weight="700">100%</text>
    <text class="meta"  x="470" y="160">pentest findings closed</text>

    <text class="accent" x="680" y="140" font-size="20" font-weight="700">3+ yrs</text>
    <text class="meta"  x="680" y="160">pawnshop &amp; lending</text>
  </g>
</svg>
