name: Render profile stats

on:
  schedule:
    # 00:20 UTC daily — 07:20 in Bangkok, so the cards are fresh by morning.
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: render-stats
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The card lives on the stats branch, not here — pull the current one in so the
      # render below can tell "nothing changed" from "first run".
      - name: Fetch the published card
        run: |
          git fetch -q --depth=1 origin stats || exit 0
          mkdir -p assets
          git show origin/stats:assets/top-langs.svg > assets/top-langs.svg 2>/dev/null || true

      - name: Render cards
        id: render
        env:
          # GH_STATS_TOKEN is optional: a PAT with repo scope also counts the
          # languages in private repos. Without it the card is public repos only.
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN || github.token }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: node scripts/build-stats.mjs

      - name: Publish the cards to the stats branch
        if: steps.render.outputs.changed != '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # An orphan branch force-pushed as a single commit: the generated SVGs get a
          # home without adding a commit to main's history every night.
          git checkout -q --orphan stats-build
          git reset -q
          git add -f assets/top-langs.svg
          git commit -q -m "Profile stats $(date -u +%Y-%m-%d)"
          git push -f -q origin stats-build:stats
