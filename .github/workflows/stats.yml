name: Render profile stats

on:
  schedule:
    # 00:20 UTC daily — 07:20 in Bangkok, so the cards are fresh by morning.
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: render-stats
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Render cards
        env:
          # GH_STATS_TOKEN is optional: a PAT with read:user also counts private
          # contributions. Without it the built-in token reports public ones only.
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN || github.token }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: node scripts/build-stats.mjs

      - name: Commit if the cards changed
        run: |
          if [ -z "$(git status --porcelain assets)" ]; then
            echo "No change, nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Update profile stats [skip ci]"
          git push
